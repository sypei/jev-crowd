<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Probe Jev with fictional moral dilemmas and watch a tiny crowd change sides.">
  <title>Jev Crowd</title>
  <link rel="stylesheet" href="/styles.css?v=4">
</head>
<body>
<main class="shell">
  <section class="composer" aria-labelledby="dilemma-label">
    <div class="input-row">
      <label id="dilemma-label" for="dilemma">Fictional moral dilemma</label>
      <span id="modeBadge" class="mode">READY</span>
    </div>
    <textarea id="dilemma" maxlength="1200" rows="3" placeholder="A runaway trolley will kill five people unless you pull a lever that redirects it toward one person. Do you pull the lever?"></textarea>
    <div class="presets" aria-label="Example dilemmas">
      <button data-preset="trolley">Trolley</button>
      <button data-preset="medicine">Medicine</button>
      <button data-preset="promise">Promise</button>
      <button data-preset="lifeboat">Lifeboat</button>
    </div>
    <span id="status" class="sr-only" aria-live="polite">Type to probe Jev.</span>
  </section>

  <section class="arena" id="arena" aria-label="Animated Jev classification crowd">
    <div class="camp act">
      <b>I WILL ACT ON IT</b>
      <strong id="score-act">50%</strong>
    </div>
    <div class="camp dont">
      <b>I WON'T ACT ON IT</b>
      <strong id="score-dont_act">50%</strong>
    </div>
    <div id="crowd" class="crowd" aria-hidden="true"></div>
    <div id="resultMessage" class="result-banner" hidden>
      <strong id="resultMessageTitle"></strong>
      <p id="resultMessageDetail"></p>
    </div>
    <p class="disclaimer">This visualizes classifier outputs, not a correct moral answer. Humans here doesn't represent real humans</p>
  </section>
</main>
<script type="module" src="/app.js?v=6"></script>
</body>
</html>
